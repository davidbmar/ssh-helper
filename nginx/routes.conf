# SSH Helper Routes Configuration
# This file is managed in the ssh-helper repository
# Deploy to: /etc/nginx/conf.d/routes/ssh-helper.conf
# Upstream defined in: upstream.conf

location /ssh/ {
    # Authentication check via oauth2-proxy
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;

    # Pass authentication headers from oauth2-proxy to backend
    auth_request_set $user $upstream_http_x_auth_request_user;
    auth_request_set $email $upstream_http_x_auth_request_email;
    auth_request_set $auth_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $auth_cookie;

    # Proxy to ssh terminal application (port 8080)
    # Trailing slash in proxy_pass strips /ssh/ prefix automatically
    proxy_pass http://ssh_terminal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass authenticated user info to backend
    proxy_set_header X-User-Email $email;
    proxy_set_header X-Auth-Request-User $user;

    # WebSocket support for terminal sessions
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}

# Redirect /ssh (without trailing slash) to /ssh/
location = /ssh {
    return 301 /ssh/;
}
